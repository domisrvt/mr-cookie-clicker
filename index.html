<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mr Cookie Clicker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="game-area">
        <img id="title-image" src="https://i.ibb.co/ny43y6C/35bf1321-f14a-4cdc-aaea-99f9a78ae1eb.png" alt="Mr Cookie Clicker">
        
        <img id="cookie" src="https://i.ibb.co/WNrY3V9x/f0f11d7d-d563-408b-9f5b-896ea9087236.png" alt="Cookie" onclick="clickCookie()">
        <p id="score">Score: <span id="scoreValue">0</span></p>
    </div>

    <div id="upgrades">
        <h2>Upgrades</h2>
        <p id="clickValue">Click Value: 1</p>
        
        <button class="upgrade" id="mainUpgrade" onclick="buyUpgrade()">Upgrade (Cost: 10 cookies)</button>
        <button class="upgrade" id="mrFireCookieClickerBtn" onclick="buyMrFireCookieClicker()">Mr Fire Cookie Clicker (Cost: 500,000 cookies)</button>
        <button class="upgrade" id="upgradeMrFireCookieClickerBtn" onclick="upgradeMrFireCookieClicker()" style="display: none;">Upgrade Mr Fire Cookie Clicker (Cost: 1,000,000 cookies)</button>

        <h2>Auto-Clicker</h2>
        <p id="autoClickerStatus">Auto-Clicker: Off</p>
        <button class="upgrade" id="buyAutoClickerBtn" onclick="buyAutoClicker()">Buy Auto-Clicker (Cost: 50 cookies)</button>
        <button class="upgrade" id="upgradeAutoClickerBtn" onclick="buyUpgradeAutoClicker()">Upgrade Auto-Clicker (Cost: 30 cookies)</button>

        <h2>Special</h2>
        <button class="upgrade" id="cookieMuncherStopperBtn" onclick="buyCookieMuncherStopper()">Cookie Muncher Stopper (Cost: 10,000,000 cookies)</button>
        <button class="upgrade" id="angryGambleBtn" onclick="buyAngryGamble()">Auto Angry Gamble (Cost: 20,000,000 cookies)</button>
    </div>

    <img id="dangerImage" class="danger-image hidden" onclick="saveCookie()" alt="Cookie Monster">
    <img id="mysteryImage" class="mystery-image hidden" onclick="claimMysteryBonus()" alt="Mystery">
    <img id="mrFireCookieClickerImage" class="mr-fire-cookie-clicker-image hidden" src="https://i.ibb.co/8yXSS82/3dgifmaker90124.gif" alt="Mr Fire Cookie Clicker">

    <button id="modButton" class="mod-button" onclick="toggleModMenu()"></button>

    <div id="modMenu" class="mod-menu hidden">
        <h3>Mod Menu</h3>
        <input type="number" id="cookieInput" placeholder="Enter cookies to add" value="1000000">
        <button onclick="addCookies()">Add Cookies</button>
        <button onclick="toggleModMenu()">Close</button>
    </div>

    <div id="notification" class="notification hidden"></div>

    <script src="mr-cookie-clicker.js"></script>

</body>
</html>
