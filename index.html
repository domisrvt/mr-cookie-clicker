<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Charlie Klicker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="game-area">
        <img id="title-image" src="https://i.ibb.co/t6k63qC/d8155f77-7690-4e00-817f-ba0adf0dccb6-removebg-preview.png" alt="Charlie Klicker">
        
        <img id="cookie" src="https://i.ibb.co/5hG6xG7j/888dfc43-c067-4e32-a57c-5f07dc1decf0-removebg-preview.png" alt="Cookie" onclick="clickCookie()">
        <p id="score">Score: <span id="scoreValue">0</span></p>
    </div>

    <div id="upgrades">
        <h2>Upgrades</h2>
        <p id="clickValue">Click Value: 1</p>
        
        <button class="upgrade" id="mainUpgrade" onclick="buyUpgrade()">Upgrade (Cost: 10 cookies)</button>
        <button class="upgrade" id="erikaClickerBtn" onclick="buyErikaClicker()">Erika Klicker (Cost: 500,000 cookies)</button>
        <button class="upgrade" id="upgradeErikaBtn" onclick="upgradeErikaClicker()" style="display: none;">Upgrade Erika (Cost: 1,000,000 cookies)</button>

        <h2>Auto-Clicker</h2>
        <p id="autoClickerStatus">Auto-Clicker: Off</p>
        <button class="upgrade" id="buyAutoClickerBtn" onclick="buyAutoClicker()">Buy Auto-Clicker (Cost: 50 cookies)</button>
        <button class="upgrade" id="upgradeAutoClickerBtn" onclick="buyUpgradeAutoClicker()">Upgrade Auto-Clicker (Cost: 30 cookies)</button>

        <h2>Special</h2>
        <button class="upgrade" id="tylerKillerBtn" onclick="buyTylerKiller()">Tyler Killer (Cost: 10,000,000 cookies)</button>
    </div>

    <img id="dangerImage" class="danger-image hidden" onclick="saveCookie()" alt="Danger">
    <img id="mysteryImage" class="mystery-image hidden" onclick="claimMysteryBonus()" alt="Mystery">
    <img id="erikaImage" class="erika-image hidden" src="https://media1.tenor.com/m/XxwtFFyuBS0AAAAd/erika-kirk-off-the-radar.gif" alt="Erika">

    <button id="modButton" class="mod-button" onclick="toggleModMenu()"></button>

    <div id="modMenu" class="mod-menu hidden">
        <h3>Mod Menu</h3>
        <input type="number" id="cookieInput" placeholder="Enter cookies to add" value="1000000">
        <button onclick="addCookies()">Add Cookies</button>
        <button onclick="toggleModMenu()">Close</button>
    </div>

    <div id="notification" class="notification hidden"></div>

    <script src="klicker.js"></script>

</body>
</html>
