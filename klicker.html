<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Charlie Klicker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="game-area">
        <img id="title-image" src="https://i.ibb.co/t6k63qC/d8155f77-7690-4e00-817f-ba0adf0dccb6-removebg-preview.png" alt="Charlie Klicker">
        
        <img id="cookie" src="https://i.ibb.co/5hG6xG7j/888dfc43-c067-4e32-a57c-5f07dc1decf0-removebg-preview.png" alt="Cookie" onclick="clickCookie()">
        <p id="score">Score: <span id="scoreValue">0</span></p>
    </div>

    <div id="upgrades">
        <h2>Upgrades</h2>
        <p id="clickValue">Click Value: 1</p>
        
        <button class="upgrade" id="mainUpgrade" onclick="buyUpgrade()">Upgrade (Cost: 10 cookies)</button>

        <h2>Auto-Clicker</h2>
        <p id="autoClickerStatus">Auto-Clicker: Off</p>
        <button class="upgrade" id="buyAutoClickerBtn" onclick="buyAutoClicker()">Buy Auto-Clicker (Cost: 50 cookies)</button>
        <button class="upgrade" id="upgradeAutoClickerBtn" onclick="buyUpgradeAutoClicker()">Upgrade Auto-Clicker (Cost: 30 cookies)</button>
    </div>

    <script src="klicker.js"></script>

</body>
</html>
